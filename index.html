<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bilingual Reader & Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        const savedTheme = localStorage.getItem('bilingual_reader_theme') || 'system';
        if (savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        html, body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        header { padding-top: max(0.75rem, env(safe-area-inset-top)); }
        aside#sidebar { 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom);
        }
        main { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }

        .ios-btn:active { opacity: 0.7; transform: scale(0.98); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="text-black dark:text-gray-100 flex bg-[#F2F2F7] dark:bg-black">

    <!-- サイドバー -->
    <aside id="sidebar" class="bg-gray-900 dark:bg-black border-r border-transparent dark:border-gray-800 text-white w-64 md:w-80 flex-shrink-0 flex flex-col h-full absolute md:relative z-30 transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="p-3 flex gap-1.5 border-b border-gray-800">
            <button id="copyAllTabsBtn" title="全タブのレスポンスを一括コピー" class="flex-1 bg-gray-800 dark:bg-[#1C1C1E] hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="truncate">全コピー</span>
            </button>
            <button id="copyCurrentTabBtn" title="現在のタブのレスポンスをコピー" class="flex-1 bg-gray-800 dark:bg-[#1C1C1E] hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span class="truncate">コピー</span>
            </button>
            <button id="newTabBtn" class="flex-none bg-blue-600 hover:bg-blue-500 text-[12px] font-medium py-2 px-2.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>新規</span>
            </button>
        </div>

        <div class="px-3 pt-2 pb-0.5 text-[11px] text-gray-500 flex justify-between items-center select-none">
            <span>履歴一覧</span>
            <span>左スライド / 長押しで削除</span>
        </div>
        
        <div id="tabList" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1.5"></div>

        <div class="p-3 border-t border-gray-800 bg-gray-900/80 dark:bg-black/80 backdrop-blur-sm">
            <button id="clearCacheBtn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-[13px] font-medium py-2 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                履歴全削除
            </button>
        </div>
    </aside>

    <!-- モバイル用オーバーレイ -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- メインエリア -->
    <div class="flex-1 flex flex-col h-full relative w-full overflow-hidden bg-[#F2F2F7] dark:bg-black">
        <header class="bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex-none px-4 pb-3 flex items-center justify-between z-10">
            <button id="menuBtn" class="md:hidden p-1.5 -ml-1 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg ios-btn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="text-[17px] font-semibold tracking-tight mx-auto select-none dark:text-white">Bilingual Reader</h1>
            
            <button id="settingsBtn" title="設定" class="p-1.5 -mr-1 text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg ios-btn transition-colors">
                <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full">
            <div class="max-w-2xl mx-auto flex flex-col gap-6">
                <!-- 入力エリア -->
                <section class="flex flex-col gap-3">
                    <div class="flex justify-between items-end px-1">
                        <label for="inputText" class="text-[13px] text-gray-500 dark:text-gray-400 uppercase font-medium">テキスト / 画像ペースト（添付順を保持）</label>
                        <button id="clearBtn" class="text-[15px] text-[#007AFF] dark:text-[#60A5FA] ios-btn">クリア</button>
                    </div>
                    <div class="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden shadow-sm border border-gray-200 dark:border-gray-800 focus-within:ring-2 focus-within:ring-[#007AFF]/30 transition-all">
                        <textarea id="inputText" rows="5" class="w-full p-4 text-[17px] leading-relaxed outline-none resize-none bg-transparent dark:text-white" placeholder="ここにテキストをペースト、またはクリップボードの画像を順番通りに貼り付け (Ctrl+V)..."></textarea>
                    </div>

                    <!-- 添付ファイル選択 & プレビュー（順番番号付き） -->
                    <div class="flex flex-col gap-2 px-1">
                        <div class="flex items-center gap-2">
                            <input type="file" id="fileInput" multiple accept="image/*, application/pdf" class="text-[13px] text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[13px] file:font-semibold file:bg-[#007AFF]/10 dark:file:bg-[#007AFF]/20 file:text-[#007AFF] dark:file:text-[#60A5FA] hover:file:bg-[#007AFF]/20 dark:hover:file:bg-[#007AFF]/30 transition-colors cursor-pointer w-full">
                        </div>
                        <div id="previewContainer" class="flex flex-wrap gap-2 empty:hidden pt-1"></div>
                    </div>

                    <div class="flex justify-between items-center px-1 mt-1 gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span id="activeModelIndicator" class="text-[12px] text-gray-500 dark:text-gray-400 truncate"></span>
                            <span id="ocrStatusIndicator" class="text-[12px] text-blue-600 dark:text-blue-400 truncate"></span>
                        </div>
                        <button id="togglePromptBtn" class="text-[13px] text-gray-500 dark:text-gray-400 underline ios-btn flex items-center gap-1 ml-auto flex-shrink-0">
                            <span>⚙️ モデル / APIキー / OCR / プロンプト</span>
                        </button>
                    </div>
                    
                    <div id="promptArea" class="hidden flex-col gap-4 p-4 bg-white dark:bg-[#1C1C1E] rounded-[10px] shadow-sm border border-gray-200 dark:border-gray-800">
                        <div class="flex flex-col gap-1">
                            <label for="apiKeyInput" class="text-[13px] text-gray-700 dark:text-gray-300 font-semibold"> APIキー</label>
                            <input type="password" id="apiKeyInput" class="w-full p-2.5 text-[14px] bg-gray-50 dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none dark:text-white" placeholder="AIzaSy...">
                        </div>

                        <!-- Gemini モデル選択プルダウン -->
                        <div class="flex flex-col gap-1.5">
                            <div class="flex justify-between items-center">
                                <label for="modelSelect" class="text-[13px] text-gray-700 dark:text-gray-300 font-semibold">使用モデル (Gemini バージョン)</label>
                                <button type="button" id="refreshModelsBtn" class="text-[12px] text-[#007AFF] dark:text-[#60A5FA] hover:underline flex items-center gap-1 ios-btn">
                                    <span>🔄 一覧を取得/更新</span>
                                </button>
                            </div>
                            <div class="relative">
                                <select id="modelSelect" class="w-full p-2.5 pr-8 text-[14px] bg-gray-50 dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none dark:text-white appearance-none cursor-pointer">
                                    <option value="auto">自動選択（標準Flash系を優先）</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-500">
                                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                </div>
                            </div>
                            <span id="modelHelpText" class="text-[11px] text-gray-400 leading-snug">※用途や回数制限に応じて切り替えられます（flash-liteは制限が緩く高速、proは高精度）。</span>
                        </div>

                        <!-- 外部OCR設定セクション -->
                        <div class="flex flex-col gap-2 p-3 bg-blue-50/50 dark:bg-blue-950/20 rounded-lg border border-blue-200/60 dark:border-blue-900/40">
                            <label for="ocrProviderSelect" class="text-[13px] text-gray-800 dark:text-gray-200 font-semibold">画像からの文字抽出（外部OCR経由）</label>
                            <select id="ocrProviderSelect" class="w-full p-2 text-[14px] bg-white dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none dark:text-white">
                                <option value="none">使わない（画像を直接Geminiへ送信）</option>
                                <option value="ocrspace">OCR.space API（無料APIキーで文字抽出→Gemini）</option>
                                <option value="vision">Google Cloud Vision API（高精度文字抽出→Gemini）</option>
                            </select>
                            
                            <div id="ocrKeyWrapper" class="hidden flex-col gap-1 mt-1">
                                <label for="ocrApiKeyInput" id="ocrApiKeyLabel" class="text-[12px] text-gray-600 dark:text-gray-400 font-medium">OCR APIキー</label>
                                <input type="password" id="ocrApiKeyInput" class="w-full p-2 text-[14px] bg-white dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none dark:text-white" placeholder="APIキーを入力...">
                                <span id="ocrHelpText" class="text-[11px] text-gray-500 dark:text-gray-400 leading-snug"></span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[13px] text-gray-700 dark:text-gray-300 font-semibold">AIへの指示文 (編集可能)</label>
                            <textarea id="promptInput" rows="7" class="w-full p-3 text-[14px] bg-gray-50 dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none resize-none leading-relaxed dark:text-white"></textarea>
                        </div>

                        <div class="flex justify-between items-center mt-1">
                            <button id="resetPromptBtn" class="text-[14px] text-red-500 dark:text-red-400 font-medium ios-btn">デフォルトに戻す</button>
                            <button id="applyPromptBtn" class="text-[14px] bg-gray-800 dark:bg-gray-100 text-white dark:text-black px-4 py-2 rounded-[8px] font-medium ios-btn">設定を保存して閉じる</button>
                        </div>
                    </div>
                    
                    <button id="translateBtn" type="button" class="bg-[#007AFF] text-white rounded-[14px] py-3.5 px-4 font-semibold text-[17px] mt-2 shadow-sm transition-all ios-btn flex justify-center items-center gap-2.5 w-full">
                        <svg id="loadingSpinner" class="animate-spin h-5 w-5 text-white hidden flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="translateBtnText">送信・翻訳する</span>
                    </button>
                </section>

                <!-- 出力エリア -->
                <section id="outputSection" class="flex flex-col gap-4 pb-12 hidden">
                    <div class="flex justify-between items-center px-1 mt-4 gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <h2 class="text-[13px] text-gray-500 dark:text-gray-400 uppercase font-medium flex-shrink-0">結果</h2>
                            <span id="usedModelBadge" class="hidden text-[11px] font-mono bg-gray-200/80 dark:bg-gray-800 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md truncate"></span>
                        </div>
                        <button id="toggleTranslationVisibilityBtn" class="text-[13px] text-[#007AFF] dark:text-[#60A5FA] font-medium flex items-center gap-1 ios-btn flex-shrink-0">
                            <svg id="toggleEyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <span id="toggleTranslationText">回答(訳文)を非表示</span>
                        </button>
                    </div>
                    <div id="resultsContainer" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- UI共通設定ドロワー -->
    <div id="settingsDrawerOverlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    <div id="settingsDrawer" class="fixed top-0 right-0 h-full w-[280px] bg-white dark:bg-[#1C1C1E] z-50 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="px-5 py-4 border-b-[2px] border-[#007AFF] flex justify-between items-center">
            <h2 class="text-[16px] font-bold text-[#007AFF]">設定</h2>
            <button id="closeSettingsDrawerBtn" class="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white text-2xl font-bold leading-none">&times;</button>
        </div>
        <div class="p-5 flex flex-col gap-3">
            <label class="text-[13px] text-gray-800 dark:text-gray-200">テーマ設定</label>
            <div class="relative">
                <select id="themeSelect" class="w-full p-2 bg-white dark:bg-[#2C2C2E] border border-gray-200 dark:border-gray-700 rounded-[4px] text-[14px] outline-none focus:border-[#007AFF] dark:text-white appearance-none cursor-pointer">
                    <option value="light">ライトモード</option>
                    <option value="dark">ダークモード</option>
                    <option value="system">システム設定に従う</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- カスタムエラーモーダル -->
    <div id="errorModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 dark:bg-[#1C1C1E]/95 backdrop-blur-xl rounded-[14px] p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="errorModalBox">
            <h3 class="text-[17px] font-semibold mb-2 dark:text-white">エラー</h3>
            <p id="errorMessage" class="text-[13px] text-gray-600 dark:text-gray-300 mb-5 leading-relaxed"></p>
            <div class="border-t border-gray-200 dark:border-gray-800 -mx-6 -mb-6">
                <button id="closeErrorBtn" class="w-full py-3 text-[17px] text-[#007AFF] dark:text-[#60A5FA] font-semibold ios-btn">OK</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 dark:bg-gray-100 text-white dark:text-black px-4 py-2 rounded-full text-[14px] opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-lg">
        コピーしました
    </div>

    <script>
        const DEFAULT_PROMPT = `You are a versatile bilingual AI assistant optimized for mobile reading. 
Analyze the user's input (text, questions, or OCR-extracted book passages) and respond appropriately.

If the user wants translation:
- Identify the source language.
- If it's English, translate to Japanese.
- If it's Japanese, translate to English.
- If it's another language, translate to Japanese.
- Clean up any minor OCR line-break artifacts so sentences read naturally.

If the user asks a general question or gives instructions:
- Answer them helpfully in the same language they used, or Japanese if appropriate.

CRITICAL RULES for chunking output:
- Divide long texts or explanations into logical chunks of roughly 7 to 8 lines.
- The maximum length of a single chunk MUST NOT exceed 10 lines.
- ALWAYS split at natural sentence boundaries.
`;

        let sessions = [];
        let currentSessionId = null;
        let isTranslationVisible = true;
        let availableModelsList = [];

        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const translateBtn = document.getElementById('translateBtn');
        const translateBtnText = document.getElementById('translateBtnText');
        const clearBtn = document.getElementById('clearBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const outputSection = document.getElementById('outputSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const usedModelBadge = document.getElementById('usedModelBadge');
        const activeModelIndicator = document.getElementById('activeModelIndicator');
        const ocrStatusIndicator = document.getElementById('ocrStatusIndicator');
        
        const toggleTranslationVisibilityBtn = document.getElementById('toggleTranslationVisibilityBtn');
        const toggleTranslationText = document.getElementById('toggleTranslationText');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');

        const promptArea = document.getElementById('promptArea');
        const togglePromptBtn = document.getElementById('togglePromptBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelSelect = document.getElementById('modelSelect');
        const refreshModelsBtn = document.getElementById('refreshModelsBtn');
        const ocrProviderSelect = document.getElementById('ocrProviderSelect');
        const ocrKeyWrapper = document.getElementById('ocrKeyWrapper');
        const ocrApiKeyLabel = document.getElementById('ocrApiKeyLabel');
        const ocrApiKeyInput = document.getElementById('ocrApiKeyInput');
        const ocrHelpText = document.getElementById('ocrHelpText');
        const promptInput = document.getElementById('promptInput');
        const resetPromptBtn = document.getElementById('resetPromptBtn');
        const applyPromptBtn = document.getElementById('applyPromptBtn');

        const errorModal = document.getElementById('errorModal');
        const errorModalBox = document.getElementById('errorModalBox');
        const errorMessage = document.getElementById('errorMessage');
        const closeErrorBtn = document.getElementById('closeErrorBtn');
        const toast = document.getElementById('toast');

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.getElementById('menuBtn');
        const newTabBtn = document.getElementById('newTabBtn');
        const copyAllTabsBtn = document.getElementById('copyAllTabsBtn');
        const copyCurrentTabBtn = document.getElementById('copyCurrentTabBtn');
        const clearCacheBtn = document.getElementById('clearCacheBtn');
        const tabList = document.getElementById('tabList');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDrawerOverlay = document.getElementById('settingsDrawerOverlay');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const closeSettingsDrawerBtn = document.getElementById('closeSettingsDrawerBtn');
        const themeSelect = document.getElementById('themeSelect');

        // テーマ設定
        function applyTheme(themeValue) {
            const htmlEl = document.documentElement;
            if (themeValue === 'dark' || (themeValue === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            } else {
                htmlEl.classList.remove('dark');
            }
        }
        const currentSavedTheme = localStorage.getItem('bilingual_reader_theme') || 'system';
        themeSelect.value = currentSavedTheme;

        // 選択中モデルの表示インジケーター更新
        function updateActiveModelIndicator() {
            const selected = localStorage.getItem('bilingual_reader_selected_model') || 'auto';
            if (selected === 'auto') {
                activeModelIndicator.textContent = '🪄 モデル: 自動選択';
            } else {
                activeModelIndicator.textContent = `🪄 ${selected.replace('models/', '')}`;
            }
        }

        // 利用可能なGeminiモデル一覧を取得してプルダウンに反映
        async function fetchAndPopulateModels(apiKey, silent = false) {
            if (!apiKey) {
                if (!silent) showError("先にGemini APIキーを入力してください。");
                return [];
            }

            if (!silent) {
                refreshModelsBtn.disabled = true;
                refreshModelsBtn.querySelector('span').textContent = '取得中...';
            }

            try {
                const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
                const response = await fetch(listUrl);
                if (!response.ok) {
                    throw new Error(`モデル一覧の取得に失敗しました (${response.status}): APIキーを確認してください。`);
                }
                const data = await response.json();
                const models = data.models || [];

                const validModels = models.filter(m => 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes('generateContent') &&
                    m.name.includes('gemini')
                );

                validModels.sort((a, b) => b.name.localeCompare(a.name));
                availableModelsList = validModels;

                localStorage.setItem('bilingual_reader_cached_models', JSON.stringify(validModels));

                renderModelSelectOptions(validModels);
                if (!silent) showToast(`${validModels.length}個のモデルを取得しました`);
                return validModels;

            } catch (err) {
                if (!silent) showError(err.message);
                return [];
            } finally {
                if (!silent) {
                    refreshModelsBtn.disabled = false;
                    refreshModelsBtn.querySelector('span').textContent = '🔄 一覧を取得/更新';
                }
            }
        }

        function renderModelSelectOptions(models) {
            const savedSelection = localStorage.getItem('bilingual_reader_selected_model') || 'auto';
            modelSelect.innerHTML = '';

            const autoOpt = document.createElement('option');
            autoOpt.value = 'auto';
            autoOpt.textContent = '自動選択（標準Flash系を優先）';
            modelSelect.appendChild(autoOpt);

            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                const shortId = m.name.replace('models/', '');
                const displayName = m.displayName ? `${m.displayName} (${shortId})` : shortId;
                opt.textContent = displayName;
                modelSelect.appendChild(opt);
            });

            if ([...modelSelect.options].some(o => o.value === savedSelection)) {
                modelSelect.value = savedSelection;
            } else {
                modelSelect.value = 'auto';
            }
        }

        refreshModelsBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key');
            fetchAndPopulateModels(key, false);
        });

        const initialApiKey = localStorage.getItem('gemini_api_key') || '';
        apiKeyInput.value = initialApiKey;
        ocrProviderSelect.value = localStorage.getItem('bilingual_reader_ocr_provider') || 'none';
        ocrApiKeyInput.value = localStorage.getItem('bilingual_reader_ocr_key') || '';
        updateOcrSettingsUI();
        updateActiveModelIndicator();

        const cachedModelsStr = localStorage.getItem('bilingual_reader_cached_models');
        if (cachedModelsStr) {
            try {
                availableModelsList = JSON.parse(cachedModelsStr);
                renderModelSelectOptions(availableModelsList);
            } catch (e) {}
        }
        if (initialApiKey) {
            fetchAndPopulateModels(initialApiKey, true);
        }

        if (!loadStateFromStorage()) {
            createNewSession();
        }

        function saveStateToStorage() {
            try {
                const sessionsToSave = sessions.map(s => ({
                    ...s,
                    attachedFiles: [], 
                    isProcessing: false
                }));
                localStorage.setItem('bilingual_reader_sessions', JSON.stringify(sessionsToSave));
                localStorage.setItem('bilingual_reader_current_id', currentSessionId);
            } catch (e) {
                console.warn("Storage capacity exceeded:", e);
            }
        }

        function loadStateFromStorage() {
            const savedStr = localStorage.getItem('bilingual_reader_sessions');
            if (!savedStr) return false;
            try {
                sessions = JSON.parse(savedStr);
                if (!Array.isArray(sessions) || sessions.length === 0) return false;
                sessions.forEach(s => {
                    s.isProcessing = false;
                    if (!s.attachedFiles) s.attachedFiles = [];
                    if (!s.usedModel) s.usedModel = '';
                });
                const savedId = localStorage.getItem('bilingual_reader_current_id');
                currentSessionId = sessions.find(s => s.id === savedId) ? savedId : sessions[0].id;
                switchSession(currentSessionId);
                return true;
            } catch (e) {
                return false;
            }
        }

        function createNewSession() {
            const id = Date.now().toString();
            const currentSession = sessions.find(s => s.id === currentSessionId);
            const initialPrompt = (currentSession && currentSession.prompt) 
                ? currentSession.prompt 
                : (localStorage.getItem('bilingual_reader_latest_prompt') || DEFAULT_PROMPT);

            const newSession = {
                id: id,
                title: '新規チャット',
                inputText: '',
                prompt: initialPrompt,
                results: [],
                usedModel: '',
                attachedFiles: [],
                isProcessing: false
            };
            sessions.unshift(newSession);
            switchSession(id);
            saveStateToStorage();
        }

        function switchSession(id) {
            if (currentSessionId) saveCurrentSessionInput();
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            
            inputText.value = session.inputText;
            promptInput.value = session.prompt;
            fileInput.value = '';
            
            renderPreviews(session);
            updateTranslateButtonState(session.isProcessing);

            if (session.results && session.results.length > 0) {
                renderResults(session.results, session.usedModel);
            } else {
                resultsContainer.innerHTML = '';
                outputSection.classList.add('hidden');
                usedModelBadge.classList.add('hidden');
            }
            
            renderTabList();
            closeSidebarMobile();
            saveStateToStorage();
        }

        // 個別タブの削除処理
        function deleteSessionById(id) {
            const idx = sessions.findIndex(s => s.id === id);
            if (idx === -1) return;

            sessions.splice(idx, 1);

            if (sessions.length === 0) {
                currentSessionId = null;
                createNewSession();
            } else if (currentSessionId === id) {
                // 削除したのが現在開いているタブなら隣のタブへ移動
                const nextSession = sessions[Math.min(idx, sessions.length - 1)];
                currentSessionId = null;
                switchSession(nextSession.id);
            } else {
                renderTabList();
                saveStateToStorage();
            }
            showToast("履歴を削除しました");
        }

        function updateTranslateButtonState(isProcessing, statusLabel = '処理中...') {
            if (isProcessing) {
                translateBtn.disabled = true;
                translateBtn.classList.add('opacity-75', 'cursor-not-allowed');
                translateBtnText.textContent = statusLabel;
                loadingSpinner.classList.remove('hidden');
            } else {
                translateBtn.disabled = false;
                translateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                translateBtnText.textContent = '送信・翻訳する';
                loadingSpinner.classList.add('hidden');
            }
        }

        function saveCurrentSessionInput() {
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.inputText = inputText.value;
                if (inputText.value.trim().length > 0 && session.results.length === 0) {
                    session.title = inputText.value.trim().substring(0, 15).replace(/\n/g, ' ') + '...';
                }
                saveStateToStorage();
            }
        }

        // タブ一覧の描画（左スワイプ・長押し・個別削除ボタン対応）
        function renderTabList() {
            tabList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId;

                // 外枠（背景に赤い削除ボタンを配置）
                const wrapper = document.createElement('div');
                wrapper.className = 'relative overflow-hidden rounded-lg bg-red-600 select-none flex-shrink-0';

                // スワイプ時に背面から現れる削除ボタン
                const bgDeleteBtn = document.createElement('button');
                bgDeleteBtn.type = 'button';
                bgDeleteBtn.className = 'absolute inset-y-0 right-0 w-16 bg-red-600 hover:bg-red-500 text-white text-[12px] font-bold flex items-center justify-center z-0';
                bgDeleteBtn.textContent = '削除';
                bgDeleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSessionById(session.id);
                };
                wrapper.appendChild(bgDeleteBtn);

                // 前面のスライド可能なタブ本体
                const itemRow = document.createElement('div');
                itemRow.className = `relative z-10 flex items-center justify-between w-full px-3 py-2.5 text-[14px] transition-transform duration-200 cursor-pointer group ${isActive ? 'bg-gray-800 dark:bg-gray-700 text-white font-semibold' : 'bg-gray-900 dark:bg-[#141416] text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate pr-2 pointer-events-none';
                titleSpan.textContent = (session.isProcessing ? '⏳ ' : '') + session.title;
                itemRow.appendChild(titleSpan);

                // PCやワンタップ削除用の小さなゴミ箱/×アイコン
                const quickDelBtn = document.createElement('button');
                quickDelBtn.type = 'button';
                quickDelBtn.title = 'この履歴を削除';
                quickDelBtn.className = `p-1 rounded hover:bg-red-500/20 hover:text-red-400 transition-opacity flex-shrink-0 ${isActive ? 'opacity-70 hover:opacity-100' : 'opacity-0 group-hover:opacity-100'}`;
                quickDelBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                quickDelBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSessionById(session.id);
                };
                itemRow.appendChild(quickDelBtn);

                // --- タッチ操作（左スワイプ ＆ 長押し）の制御 ---
                let startX = 0;
                let startY = 0;
                let currentX = 0;
                let isSwiping = false;
                let isOpened = false;
                let pressTimer = null;
                let longPressTriggered = false;

                itemRow.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    currentX = isOpened ? -64 : 0;
                    isSwiping = false;
                    longPressTriggered = false;
                    itemRow.style.transition = 'none';

                    // 長押し判定タイマー（550ms）
                    pressTimer = setTimeout(() => {
                        longPressTriggered = true;
                        if (navigator.vibrate) navigator.vibrate(30);
                        if (confirm(`「${session.title}」を削除しますか？`)) {
                            deleteSessionById(session.id);
                        }
                    }, 550);
                }, { passive: true });

                itemRow.addEventListener('touchmove', (e) => {
                    if (e.touches.length !== 1) return;
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;

                    // 指が一定以上動いたら長押しをキャンセル
                    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                        clearTimeout(pressTimer);
                    }

                    // 横方向の動きが縦方向より大きい場合はスワイプとみなす
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                        isSwiping = true;
                        let translate = (isOpened ? -64 : 0) + dx;
                        // 右方向には行き過ぎないよう制限、左は最大140pxまで
                        if (translate > 0) translate = 0;
                        if (translate < -140) translate = -140;
                        currentX = translate;
                        itemRow.style.transform = `translateX(${currentX}px)`;
                    }
                }, { passive: true });

                itemRow.addEventListener('touchend', () => {
                    clearTimeout(pressTimer);
                    itemRow.style.transition = 'transform 0.2s ease-out';

                    if (isSwiping) {
                        if (currentX < -115) {
                            // 大きく左へ引き切った場合はそのまま削除
                            deleteSessionById(session.id);
                        } else if (currentX < -32) {
                            // 削除ボタンが半分以上見えたら開いた状態で固定
                            itemRow.style.transform = 'translateX(-64px)';
                            isOpened = true;
                        } else {
                            // 元に戻す
                            itemRow.style.transform = 'translateX(0px)';
                            isOpened = false;
                        }
                    }
                });

                // クリック（タップ）時の処理
                itemRow.addEventListener('click', (e) => {
                    if (longPressTriggered || isSwiping) {
                        e.preventDefault();
                        return;
                    }
                    if (isOpened) {
                        // 削除ボタンが開いている状態なら閉じるだけ
                        itemRow.style.transform = 'translateX(0px)';
                        isOpened = false;
                        return;
                    }
                    switchSession(session.id);
                });

                wrapper.appendChild(itemRow);
                tabList.appendChild(wrapper);
            });
        }

        translateBtn.addEventListener('click', processTranslation);

        togglePromptBtn.addEventListener('click', async () => {
            if (promptArea.classList.contains('hidden')) {
                const session = sessions.find(s => s.id === currentSessionId);
                promptInput.value = session.prompt;
                const savedKey = localStorage.getItem('gemini_api_key') || '';
                apiKeyInput.value = savedKey;
                ocrProviderSelect.value = localStorage.getItem('bilingual_reader_ocr_provider') || 'none';

        applyPromptBtn.addEventListener('click', async () => {
            const session = sessions.find(s => s.id === currentSessionId);
            const chosenPrompt = promptInput.value.trim() || DEFAULT_PROMPT;
            session.prompt = chosenPrompt;
            localStorage.setItem('bilingual_reader_latest_prompt', chosenPrompt);

            const prevKey = localStorage.getItem('gemini_api_key') || '';
            const keyVal = apiKeyInput.value.trim();
            if (keyVal) {
                localStorage.setItem('gemini_api_key', keyVal);
                if (keyVal !== prevKey) {
                    sessionStorage.removeItem('gemini_valid_model');
                    await fetchAndPopulateModels(keyVal, true);
                }
            }

            localStorage.setItem('bilingual_reader_selected_model', modelSelect.value);
            updateActiveModelIndicator();

            localStorage.setItem('bilingual_reader_ocr_provider', ocrProviderSelect.value);
            localStorage.setItem('bilingual_reader_ocr_key', ocrApiKeyInput.value.trim());
            updateOcrSettingsUI();

            promptArea.classList.add('hidden');
            promptArea.classList.remove('flex');
            saveStateToStorage();
            showToast("設定を保存しました");
        });

        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            let imageFound = false;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const b64Data = await fileToBase64(blob);
                    session.attachedFiles.push({
                        name: `ペースト画像_${session.attachedFiles.length + 1}`,
                        mimeType: b64Data.mimeType,
                        data: b64Data.data
                    });
                    imageFound = true;
                }
            }
            if (imageFound) {
                renderPreviews(session);
                showToast(`画像を添付しました (${session.attachedFiles.length}枚目)`);
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            for (const file of e.target.files) {
                const b64Data = await fileToBase64(file);
                session.attachedFiles.push({
                    name: file.name,
                    mimeType: b64Data.mimeType,
                    data: b64Data.data
                });
            }
            renderPreviews(session);
            fileInput.value = '';
        });

        function renderPreviews(session) {
            previewContainer.innerHTML = '';
            if (!session.attachedFiles || session.attachedFiles.length === 0) return;

            session.attachedFiles.forEach((file, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative group w-16 h-16 rounded-lg overflow-hidden border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-[#2C2C2E] flex items-center justify-center';

                const orderBadge = document.createElement('span');
                orderBadge.className = 'absolute bottom-0 left-0 bg-[#007AFF] text-white text-[10px] font-bold px-1.5 py-0.2 rounded-tr z-10';
                orderBadge.textContent = `${index + 1}`;
                wrap.appendChild(orderBadge);

                if (file.mimeType.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = `data:${file.mimeType};base64,${file.data}`;
                    img.className = 'w-full h-full object-cover';
                    wrap.appendChild(img);
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'text-[10px] text-gray-500 dark:text-gray-400 font-bold p-1 text-center truncate';
                    icon.textContent = 'PDF';
                    wrap.appendChild(icon);
                }

                const delBtn = document.createElement('button');
                delBtn.className = 'absolute top-0 right-0 bg-black/60 text-white rounded-bl p-0.5 hover:bg-red-600 transition-colors ios-btn z-10';
                delBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                delBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    session.attachedFiles.splice(index, 1);
                    renderPreviews(session);
                };

                wrap.appendChild(delBtn);
                previewContainer.appendChild(wrap);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    mimeType: file.type,
                    data: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
            });
        }

        function compressImageIfNeeded(base64Data, mimeType, maxBytes = 900 * 1024) {
            return new Promise((resolve) => {
                const approxBytes = (base64Data.length * 3) / 4;
                if (approxBytes <= maxBytes || !mimeType.startsWith('image/')) {
                    resolve({ data: base64Data, mimeType: mimeType });
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1800;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    resolve({
                        data: compressedDataUrl.split(',')[1],
                        mimeType: 'image/jpeg'
                    });
                };
                img.onerror = () => resolve({ data: base64Data, mimeType: mimeType });
                img.src = `data:${mimeType};base64,${base64Data}`;
            });
        }

        async function extractTextViaExternalOcr(files, provider, ocrKey, geminiKey, onProgress) {
            const extractedTexts = [];

            for (let i = 0; i < files.length; i++) {
                onProgress(`文字抽出中 (${i + 1}/${files.length}枚目)...`);
                const file = files[i];

                if (provider === 'ocrspace') {
                    if (!ocrKey) {
                        throw new Error("OCR.spaceのAPIキーが設定されていません。設定画面から入力してください。");
                    }
                    const compressed = await compressImageIfNeeded(file.data, file.mimeType);
                    const formData = new FormData();
                    formData.append('apikey', ocrKey);
                    formData.append('base64Image', `data:${compressed.mimeType};base64,${compressed.data}`);
                    formData.append('language', 'eng');
                    formData.append('OCREngine', '2');

                    const res = await fetch('https://api.ocr.space/parse/image', {
                        method: 'POST',
                        body: formData
                    });
                    if (!res.ok) throw new Error(`OCR.space 通信エラー: ${res.status}`);
                    const json = await res.json();
                    if (json.IsErroredOnProcessing) {
                        throw new Error(`OCR.space エラー (${i + 1}枚目): ${json.ErrorMessage?.[0] || '文字抽出に失敗しました'}`);
                    }
                    const pageText = json.ParsedResults?.[0]?.ParsedText || '';
                    if (pageText.trim()) extractedTexts.push(pageText.trim());

                } else if (provider === 'vision') {
                    const effectiveKey = ocrKey || geminiKey;
                    const visionUrl = `https://vision.googleapis.com/v1/images:annotate?key=${effectiveKey}`;
                    const res = await fetch(visionUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            requests: [{
                                image: { content: file.data },
                                features: [{ type: 'DOCUMENT_TEXT_DETECTION' }]
                            }]
                        })
                    });
                    if (!res.ok) {
                        const errJson = await res.json().catch(() => ({}));
                        throw new Error(`Google Vision APIエラー (${res.status}): ${errJson.error?.message || 'APIが有効化されているか確認してください'}`);
                    }
                    const json = await res.json();
                    const pageText = json.responses?.[0]?.fullTextAnnotation?.text || '';
                    if (pageText.trim()) extractedTexts.push(pageText.trim());
                }
            }

            return extractedTexts.join('\n\n');
        }

        async function copyToClipboard(text, successMsg = "コピーしました") {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg);
            } catch (err) {
                showError("クリップボードへのコピーに失敗しました。");
            }
        }

        function formatSessionResults(results) {
            let text = "";
            results.forEach(block => {
                if (block.speaker) text += `(${block.speaker})\n`;
                if (block.sourceText) text += `${block.sourceText}\n\n`;
                if (block.translatedText) text += `${block.translatedText}\n\n`;
            });
            return text.trim();
        }

        copyCurrentTabBtn.addEventListener('click', () => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session || !session.results || session.results.length === 0) {
                showError("現在のタブにコピーする結果がありません。");
                return;
            }
            copyToClipboard(formatSessionResults(session.results), "タブ内の結果をコピーしました");
        });

        copyAllTabsBtn.addEventListener('click', () => {
            const validSessions = sessions.filter(s => s.results && s.results.length > 0);
            if (validSessions.length === 0) {
                showError("コピー可能な結果が存在しません。");
                return;
            }
            const orderedSessions = [...validSessions].reverse();
            const combinedText = orderedSessions.map((s) => `=== [${s.title}] ===\n\n${formatSessionResults(s.results)}`).join('\n\n---\n\n');
            copyToClipboard(combinedText, "全タブの結果を一括コピーしました");
        });

        window.copyCardById = function(cardId) {
            const block = window[cardId];
            if (!block) return;
            let text = "";
            if (block.speaker) text += `(${block.speaker})\n`;
            if (block.sourceText) text += `${block.sourceText}\n\n`;
            if (block.translatedText) text += `${block.translatedText}`;
            copyToClipboard(text.trim(), "カードの内容をコピーしました");
        };

        async function processTranslation() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showError("APIキーが設定されていません。「モデル / APIキー / OCR / プロンプト」からGemini APIキーを入力してください。");
                return;
            }

            let textToSend = inputText.value.trim();
            const targetSession = sessions.find(s => s.id === currentSessionId);
            let filesToSend = targetSession.attachedFiles || [];

            if (!textToSend && filesToSend.length === 0) {
                showError("テキストまたは画像を入力・ペーストしてください。");
                return;
            }

            targetSession.isProcessing = true;
            updateTranslateButtonState(true, '準備中...');
            renderTabList();

            if (currentSessionId === targetSession.id) {
                outputSection.classList.add('hidden');
                resultsContainer.innerHTML = '';
            }

            try {
                const ocrProvider = localStorage.getItem('bilingual_reader_ocr_provider') || 'none';
                const ocrKey = localStorage.getItem('bilingual_reader_ocr_key') || '';

                if (ocrProvider !== 'none' && filesToSend.length > 0) {
                    const extractedText = await extractTextViaExternalOcr(
                        filesToSend,
                        ocrProvider,
                        ocrKey,
                        apiKey,
                        (statusMsg) => {
                            if (currentSessionId === targetSession.id) {
                                updateTranslateButtonState(true, statusMsg);
                            }
                        }
                    );

                    if (!extractedText && !textToSend) {
                        throw new Error("画像から文字を検出できませんでした。");
                    }

                    textToSend = [textToSend, extractedText].filter(Boolean).join('\n\n');
                    filesToSend = []; 
                }

                if (currentSessionId === targetSession.id) {
                    updateTranslateButtonState(true, '翻訳中...');
                }

                const responseObj = await callGeminiAPI(apiKey, textToSend, filesToSend, targetSession.prompt);
                
                targetSession.results = responseObj.results;
                targetSession.usedModel = responseObj.usedModel;

                if (textToSend) {
                    targetSession.title = textToSend.substring(0, 15).replace(/\n/g, ' ') + '...';
                } else {
                    targetSession.title = "画像解析";
                }

                if (currentSessionId === targetSession.id) {
                    renderResults(targetSession.results, targetSession.usedModel);
                }
                
                saveStateToStorage();

            } catch (err) {
                console.error(err);
                showError(err.message || "処理中にエラーが発生しました。");
            } finally {
                targetSession.isProcessing = false;
                if (currentSessionId === targetSession.id) {
                    updateTranslateButtonState(false);
                }
                renderTabList();
            }
        }

        async function resolveTargetModel(apiKey) {
            const selected = localStorage.getItem('bilingual_reader_selected_model') || 'auto';
            if (selected !== 'auto') {
                return selected.startsWith('models/') ? selected : `models/${selected}`;
            }

            const cachedModel = sessionStorage.getItem('gemini_valid_model');
            if (cachedModel) return cachedModel;

            const validModels = availableModelsList.length > 0 
                ? availableModelsList 
                : await fetchAndPopulateModels(apiKey, true);

            const preferred = 
                validModels.find(m => m.name.includes('flash-lite') && !m.name.includes('preview')) ||
                validModels.find(m => m.name.includes('flash') && !m.name.includes('preview')) ||
                validModels.find(m => m.name.includes('flash')) ||
                validModels.find(m => m.name.includes('pro')) ||
                validModels[0];

            if (!preferred) {
                throw new Error("このAPIキーで利用可能なテキスト生成モデルが見つかりませんでした。");
            }

            sessionStorage.setItem('gemini_valid_model', preferred.name);
            return preferred.name;
        }

        async function callGeminiAPI(apiKey, text, attachedFiles, promptStr, retries = 3, delay = 1000) {
            const modelName = await resolveTargetModel(apiKey);
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;

            const parts = [];
            if (text) parts.push({ text: text });
            attachedFiles.forEach(fileData => {
                parts.push({
                    inlineData: { mimeType: fileData.mimeType, data: fileData.data }
                });
            });

            const jsonInstruction = `\n\nYOU MUST RESPOND ONLY WITH A VALID JSON ARRAY. No explanations, no markdown blocks outside the JSON.
Format:
[
  {
    "speaker": "Speaker Name (or empty string. Use if applicable)",
    "sourceText": "Original text segment, user query, or topic description",
    "translatedText": "Translated text, answer, or your main response"
  }
]
If the user asks a general question, put the context/question in 'sourceText' and your answer in 'translatedText'.`;

            const payload = {
                contents: [{ parts: parts }],
                systemInstruction: {
                    parts: [{ text: promptStr + jsonInstruction }]
                },
                generationConfig: {
                    temperature: 0.2,
                    responseMimeType: "application/json"
                },
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400) throw new Error("APIエラー (400): リクエスト形式が無効か、選択したモデルがこの入力形式に対応していません。");
                        if (response.status === 403) throw new Error("APIエラー (403): APIキーが無効か権限がありません。");
                        if (response.status === 404) {
                            sessionStorage.removeItem('gemini_valid_model');
                            throw new Error(`APIエラー (404): モデル(${modelName.replace('models/', '')})が見つかりません。別のモデルを選択してください。`);
                        }
                        if (response.status === 429) {
                            const rateError = new Error(`API制限 (429): ${modelName.replace('models/', '')} のリクエスト上限に達しました。別のモデルに切り替えるか、1〜2分待ってください。`);
                            rateError.noRetry = true;
                            throw rateError;
                        }
                        if (response.status === 503) {
                            throw new Error("APIエラー (503): Googleのサーバーが一時的に混雑しています。数秒待つか別のモデルをお試しください。");
                        }
                        throw new Error(`APIエラー: ${response.status}`);
                    }

                    const result = await response.json();
                    const actualModel = result.modelVersion || modelName.replace('models/', '');
                    let rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (rawText) {
                        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                        let parsedResults;
                        try {
                            const parsed = JSON.parse(rawText);
                            parsedResults = Array.isArray(parsed) ? parsed : [parsed];
                        } catch (parseError) {
                            parsedResults = [{
                                speaker: "",
                                sourceText: "",
                                translatedText: rawText
                            }];
                        }
                        return { results: parsedResults, usedModel: actualModel };
                    } else {
                        const finishReason = result.candidates?.[0]?.finishReason;
                        if (finishReason === 'SAFETY') {
                            throw new Error("APIエラー: セーフティフィルターによってブロックされました。");
                        } else if (finishReason === 'RECITATION') {
                            throw new Error("APIエラー: 著作権保護フィルターによりブロックされました。");
                        } else {
                            throw new Error("APIレスポンスにテキストが含まれていません。");
                        }
                    }
                } catch (error) {
                    if (error.noRetry || i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        function renderResults(dataArray, modelName = '') {
            resultsContainer.innerHTML = '';
            if (!Array.isArray(dataArray) || dataArray.length === 0) return;

            if (modelName) {
                usedModelBadge.textContent = modelName;
                usedModelBadge.classList.remove('hidden');
            } else {
                usedModelBadge.classList.add('hidden');
            }

            dataArray.forEach(block => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-[#1C1C1E] rounded-[14px] shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden relative group";

                let speakerHtml = '';
                if (block.speaker) {
                    speakerHtml = `
                        <div class="px-4 py-2.5 bg-gray-50 dark:bg-[#2C2C2E] border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <span class="text-[13px] font-semibold text-gray-500 dark:text-gray-400">${escapeHtml(block.speaker)}</span>
                        </div>
                    `;
                }

                const cardId = 'card_' + Math.random().toString(36).substr(2, 9);
                window[cardId] = block;

                const copyBtnHtml = `
                    <button class="absolute top-2 right-2 p-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 bg-white/80 dark:bg-black/80 rounded-md opacity-0 group-hover:opacity-100 transition-opacity ios-btn" onclick="copyCardById('${cardId}')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                `;

                const sourceHtml = block.sourceText ? `
                    <div class="text-[16px] text-gray-900 dark:text-gray-100 leading-relaxed font-sans pr-8">
                        ${escapeHtml(block.sourceText).replace(/\n/g, '<br>')}
                    </div>
                ` : '';

                const translatedHtml = `
                    <div class="translated-content ${isTranslationVisible ? '' : 'hidden'} flex flex-col gap-3">
                        ${block.sourceText ? '<div class="h-px bg-gray-100 dark:bg-gray-800 w-full"></div>' : ''}
                        <div class="text-[16px] text-[#007AFF] dark:text-[#60A5FA] leading-relaxed font-sans pr-8">
                            ${escapeHtml(block.translatedText || '').replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;

                const textHtml = `
                    <div class="p-4 flex flex-col gap-3 ${speakerHtml ? 'pt-4' : 'pt-5'}">
                        ${sourceHtml}
                        ${translatedHtml}
                    </div>
                `;

                card.innerHTML = speakerHtml + copyBtnHtml + textHtml;
                resultsContainer.appendChild(card);
            });

            outputSection.classList.remove('hidden');
            setTimeout(() => {
                outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function showToast(msg = "コピーしました") {
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorModal.classList.remove('hidden');
            errorModal.classList.add('flex');
            requestAnimationFrame(() => {
                errorModal.classList.remove('opacity-0');
                errorModalBox.classList.remove('scale-95');
            });
        }

        function closeError() {
            errorModal.classList.add('opacity-0');
            errorModalBox.classList.add('scale-95');
            setTimeout(() => {
                errorModal.classList.add('hidden');
                errorModal.classList.remove('flex');
            }, 300);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
