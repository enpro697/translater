<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bilingual Reader & Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        // 初期読み込み時のテーマ判定
        const savedTheme = localStorage.getItem('bilingual_reader_theme') || 'system';
        if (savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        html, body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        header { padding-top: max(0.75rem, env(safe-area-inset-top)); }
        aside#sidebar { 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom);
        }
        main { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }

        .ios-btn:active { opacity: 0.7; transform: scale(0.98); }
        .ios-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="text-black dark:text-gray-100 flex bg-[#F2F2F7] dark:bg-black">

    <!-- サイドバー -->
    <aside id="sidebar" class="bg-gray-900 dark:bg-black border-r border-transparent dark:border-gray-800 text-white w-64 md:w-80 flex-shrink-0 flex flex-col h-full absolute md:relative z-30 transition-transform duration-300 -translate-x-full md:translate-x-0">
        <!-- 上部アクションボタン群 -->
        <div class="p-3 flex gap-1.5 border-b border-gray-800">
            <button id="copyAllTabsBtn" title="全タブのレスポンスを一括コピー" class="flex-1 bg-gray-800 dark:bg-[#1C1C1E] hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="truncate">全コピー</span>
            </button>
            <button id="copyCurrentTabBtn" title="現在のタブのレスポンスをコピー" class="flex-1 bg-gray-800 dark:bg-[#1C1C1E] hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span class="truncate">コピー</span>
            </button>
            <button id="newTabBtn" class="flex-none bg-blue-600 hover:bg-blue-500 text-[12px] font-medium py-2 px-2.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>新規</span>
            </button>
        </div>
        
        <!-- タブリスト -->
        <div id="tabList" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1"></div>

        <!-- 下部アクション (キャッシュクリア) -->
        <div class="p-3 border-t border-gray-800 bg-gray-900/80 dark:bg-black/80 backdrop-blur-sm">
            <button id="clearCacheBtn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-[13px] font-medium py-2 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                履歴全削除
            </button>
        </div>
    </aside>

    <!-- モバイル用オーバーレイ -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- メインエリア -->
    <div class="flex-1 flex flex-col h-full relative w-full overflow-hidden bg-[#F2F2F7] dark:bg-black">
        <header class="bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex-none px-4 pb-3 flex items-center justify-between z-10">
            <button id="menuBtn" class="md:hidden p-1.5 -ml-1 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg ios-btn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="text-[17px] font-semibold tracking-tight mx-auto select-none dark:text-white">Bilingual Reader</h1>
            
            <!-- 薄い線の歯車アイコン -->
            <button id="settingsBtn" title="設定" class="p-1.5 -mr-1 text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg ios-btn transition-colors">
                <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full">
            <div class="max-w-2xl mx-auto flex flex-col gap-6">
                <!-- 入力エリア -->
                <section class="flex flex-col gap-3">
                    <div class="flex justify-between items-end px-1">
                        <label for="inputText" class="text-[13px] text-gray-500 dark:text-gray-400 uppercase font-medium">テキスト / 画像ペースト</label>
                        <button id="clearBtn" class="text-[15px] text-[#007AFF] dark:text-[#60A5FA] ios-btn">クリア</button>
                    </div>
                    <div class="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden shadow-sm border border-gray-200 dark:border-gray-800 focus-within:ring-2 focus-within:ring-[#007AFF]/30 transition-all">
                        <textarea id="inputText" rows="5" class="w-full p-4 text-[17px] leading-relaxed outline-none resize-none bg-transparent dark:text-white" placeholder="ここにテキストをペースト、またはクリップボードの画像を直接貼り付け (Ctrl+V)..."></textarea>
                    </div>

                    <!-- 添付ファイル選択 & プレビュー -->
                    <div class="flex flex-col gap-2 px-1">
                        <div class="flex items-center gap-2">
                            <input type="file" id="fileInput" multiple accept="image/*, application/pdf" class="text-[13px] text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[13px] file:font-semibold file:bg-[#007AFF]/10 dark:file:bg-[#007AFF]/20 file:text-[#007AFF] dark:file:text-[#60A5FA] hover:file:bg-[#007AFF]/20 dark:hover:file:bg-[#007AFF]/30 transition-colors cursor-pointer w-full">
                        </div>
                        <div id="previewContainer" class="flex flex-wrap gap-2 empty:hidden pt-1"></div>
                    </div>

                    <div class="flex justify-end px-1 mt-1">
                        <button id="togglePromptBtn" class="text-[13px] text-gray-500 dark:text-gray-400 underline ios-btn flex items-center gap-1">
                            <span>⚙️ プロンプト設定 / APIキー設定</span>
                        </button>
                    </div>
                    
                    <div id="promptArea" class="hidden flex-col gap-4 p-4 bg-white dark:bg-[#1C1C1E] rounded-[10px] shadow-sm border border-gray-200 dark:border-gray-800">
                        <div class="flex flex-col gap-1">
                            <label for="apiKeyInput" class="text-[13px] text-gray-700 dark:text-gray-300 font-semibold">Gemini APIキー</label>
                            <input type="password" id="apiKeyInput" class="w-full p-2.5 text-[14px] bg-gray-50 dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none dark:text-white" placeholder="AIzaSy... または AQ...">
                            <span class="text-[11px] text-gray-400">※キーはブラウザ内（localStorage）にのみ保存されます。</span>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[13px] text-gray-700 dark:text-gray-300 font-semibold">AIへの指示文 (編集可能)</label>
                            <textarea id="promptInput" rows="7" class="w-full p-3 text-[14px] bg-gray-50 dark:bg-[#2C2C2E] rounded border border-gray-200 dark:border-gray-700 outline-none resize-none leading-relaxed dark:text-white"></textarea>
                        </div>

                        <div class="flex justify-between items-center mt-1">
                            <button id="resetPromptBtn" class="text-[14px] text-red-500 dark:text-red-400 font-medium ios-btn">デフォルトに戻す</button>
                            <button id="applyPromptBtn" class="text-[14px] bg-gray-800 dark:bg-gray-100 text-white dark:text-black px-4 py-2 rounded-[8px] font-medium ios-btn">設定を保存して閉じる</button>
                        </div>
                    </div>
                    
                    <button id="translateBtn" class="bg-[#007AFF] text-white rounded-[14px] py-3.5 px-4 font-semibold text-[17px] mt-2 shadow-sm transition-transform ios-btn flex justify-center items-center gap-2 w-full">
                        <span>送信・翻訳する</span>
                        <div id="loadingSpinner" class="ios-spinner hidden"></div>
                    </button>
                </section>

                <!-- 出力エリア -->
                <section id="outputSection" class="flex flex-col gap-4 pb-12 hidden">
                    <div class="flex justify-between items-center px-1 mt-4">
                        <h2 class="text-[13px] text-gray-500 dark:text-gray-400 uppercase font-medium">結果</h2>
                        <!-- 訳文一括開閉ボタン -->
                        <button id="toggleTranslationVisibilityBtn" class="text-[13px] text-[#007AFF] dark:text-[#60A5FA] font-medium flex items-center gap-1 ios-btn">
                            <svg id="toggleEyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <span id="toggleTranslationText">回答(訳文)を非表示</span>
                        </button>
                    </div>
                    <div id="resultsContainer" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- UI共通設定ドロワー -->
    <div id="settingsDrawerOverlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    <div id="settingsDrawer" class="fixed top-0 right-0 h-full w-[280px] bg-white dark:bg-[#1C1C1E] z-50 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="px-5 py-4 border-b-[2px] border-[#007AFF] flex justify-between items-center">
            <h2 class="text-[16px] font-bold text-[#007AFF]">設定</h2>
            <button id="closeSettingsDrawerBtn" class="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white text-2xl font-bold leading-none">&times;</button>
        </div>
        <div class="p-5 flex flex-col gap-3">
            <label class="text-[13px] text-gray-800 dark:text-gray-200">テーマ設定</label>
            <div class="relative">
                <select id="themeSelect" class="w-full p-2 bg-white dark:bg-[#2C2C2E] border border-gray-200 dark:border-gray-700 rounded-[4px] text-[14px] outline-none focus:border-[#007AFF] dark:text-white appearance-none cursor-pointer">
                    <option value="light">ライトモード</option>
                    <option value="dark">ダークモード</option>
                    <option value="system">システム設定に従う</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- カスタムエラーモーダル -->
    <div id="errorModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 dark:bg-[#1C1C1E]/95 backdrop-blur-xl rounded-[14px] p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="errorModalBox">
            <h3 class="text-[17px] font-semibold mb-2 dark:text-white">エラー</h3>
            <p id="errorMessage" class="text-[13px] text-gray-600 dark:text-gray-300 mb-5 leading-relaxed"></p>
            <div class="border-t border-gray-200 dark:border-gray-800 -mx-6 -mb-6">
                <button id="closeErrorBtn" class="w-full py-3 text-[17px] text-[#007AFF] dark:text-[#60A5FA] font-semibold ios-btn">OK</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 dark:bg-gray-100 text-white dark:text-black px-4 py-2 rounded-full text-[14px] opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-lg">
        コピーしました
    </div>

    <script>
        const DEFAULT_PROMPT = `You are a versatile bilingual AI assistant optimized for mobile reading. 
Analyze the user's input (text, questions, or images) and respond appropriately.
This is for personal language learning and reading comprehension of a legally purchased book.
If the user wants translation:
- Identify the source language.
- If it's English, translate to Japanese.
- If it's Japanese, translate to English.
- If it's another language, translate to Japanese.

If the user asks a general question or gives instructions:
- Answer them helpfully in the same language they used, or Japanese if appropriate.

CRITICAL RULES for chunking output:
- Divide long texts or explanations into logical chunks of roughly 7 to 8 lines.
- The maximum length of a single chunk MUST NOT exceed 10 lines.
- ALWAYS split at natural sentence boundaries.
- 漫画等の画像のルビは表示しなくてよい
`;

        let sessions = [];
        let currentSessionId = null;
        let isTranslationVisible = true;

        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const outputSection = document.getElementById('outputSection');
        const resultsContainer = document.getElementById('resultsContainer');
        
        const toggleTranslationVisibilityBtn = document.getElementById('toggleTranslationVisibilityBtn');
        const toggleTranslationText = document.getElementById('toggleTranslationText');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');

        const promptArea = document.getElementById('promptArea');
        const togglePromptBtn = document.getElementById('togglePromptBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const promptInput = document.getElementById('promptInput');
        const resetPromptBtn = document.getElementById('resetPromptBtn');
        const applyPromptBtn = document.getElementById('applyPromptBtn');

        const errorModal = document.getElementById('errorModal');
        const errorModalBox = document.getElementById('errorModalBox');
        const errorMessage = document.getElementById('errorMessage');
        const closeErrorBtn = document.getElementById('closeErrorBtn');
        const toast = document.getElementById('toast');

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.getElementById('menuBtn');
        const newTabBtn = document.getElementById('newTabBtn');
        const copyAllTabsBtn = document.getElementById('copyAllTabsBtn');
        const copyCurrentTabBtn = document.getElementById('copyCurrentTabBtn');
        const clearCacheBtn = document.getElementById('clearCacheBtn');
        const tabList = document.getElementById('tabList');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDrawerOverlay = document.getElementById('settingsDrawerOverlay');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const closeSettingsDrawerBtn = document.getElementById('closeSettingsDrawerBtn');
        const themeSelect = document.getElementById('themeSelect');

        function applyTheme(themeValue) {
            const htmlEl = document.documentElement;
            if (themeValue === 'dark' || (themeValue === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            } else {
                htmlEl.classList.remove('dark');
            }
        }

        const currentSavedTheme = localStorage.getItem('bilingual_reader_theme') || 'system';
        themeSelect.value = currentSavedTheme;
        
        themeSelect.addEventListener('change', (e) => {
            const newTheme = e.target.value;
            localStorage.setItem('bilingual_reader_theme', newTheme);
            applyTheme(newTheme);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (localStorage.getItem('bilingual_reader_theme') === 'system') {
                applyTheme('system');
            }
        });

        function openSettingsDrawer() {
            settingsDrawerOverlay.classList.remove('hidden');
            void settingsDrawerOverlay.offsetWidth; 
            settingsDrawerOverlay.classList.remove('opacity-0');
            settingsDrawer.classList.remove('translate-x-full');
        }

        function closeSettingsDrawer() {
            settingsDrawerOverlay.classList.add('opacity-0');
            settingsDrawer.classList.add('translate-x-full');
            setTimeout(() => {
                settingsDrawerOverlay.classList.add('hidden');
            }, 300);
        }

        settingsBtn.addEventListener('click', openSettingsDrawer);
        closeSettingsDrawerBtn.addEventListener('click', closeSettingsDrawer);
        settingsDrawerOverlay.addEventListener('click', closeSettingsDrawer);

        apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';

        if (!loadStateFromStorage()) {
            createNewSession();
        }

        function saveStateToStorage() {
            try {
                const sessionsToSave = sessions.map(s => ({
                    ...s,
                    attachedFiles: [], 
                    isProcessing: false
                }));
                localStorage.setItem('bilingual_reader_sessions', JSON.stringify(sessionsToSave));
                localStorage.setItem('bilingual_reader_current_id', currentSessionId);
            } catch (e) {
                console.warn("Storage capacity exceeded:", e);
            }
        }

        function loadStateFromStorage() {
            const savedStr = localStorage.getItem('bilingual_reader_sessions');
            if (!savedStr) return false;
            
            try {
                sessions = JSON.parse(savedStr);
                if (!Array.isArray(sessions) || sessions.length === 0) return false;

                sessions.forEach(s => {
                    s.isProcessing = false;
                    if (!s.attachedFiles) s.attachedFiles = [];
                });

                const savedId = localStorage.getItem('bilingual_reader_current_id');
                currentSessionId = sessions.find(s => s.id === savedId) ? savedId : sessions[0].id;
                
                switchSession(currentSessionId);
                return true;
            } catch (e) {
                console.error("Failed to load sessions from storage:", e);
                return false;
            }
        }

        function createNewSession() {
            const id = Date.now().toString();

            let initialPrompt = DEFAULT_PROMPT;
            const currentSession = sessions.find(s => s.id === currentSessionId);
            if (currentSession && currentSession.prompt) {
                initialPrompt = currentSession.prompt;
            } else {
                initialPrompt = localStorage.getItem('bilingual_reader_latest_prompt') || DEFAULT_PROMPT;
            }

            const newSession = {
                id: id,
                title: '新規チャット',
                inputText: '',
                prompt: initialPrompt,
                results: [],
                attachedFiles: [],
                isProcessing: false
            };
            sessions.unshift(newSession);
            switchSession(id);
            saveStateToStorage();
        }

        function switchSession(id) {
            if (currentSessionId) saveCurrentSessionInput();
            
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            
            inputText.value = session.inputText;
            promptInput.value = session.prompt;
            fileInput.value = '';
            
            renderPreviews(session);
            updateTranslateButtonState(session.isProcessing);

            if (session.results && session.results.length > 0) {
                renderResults(session.results);
            } else {
                resultsContainer.innerHTML = '';
                outputSection.classList.add('hidden');
            }
            
            renderTabList();
            closeSidebarMobile();
            saveStateToStorage();
        }

        function updateTranslateButtonState(isProcessing) {
            if (isProcessing) {
                translateBtn.disabled = true;
                translateBtn.classList.add('opacity-70');
                translateBtn.querySelector('span').textContent = '処理中...';
                loadingSpinner.classList.remove('hidden');
            } else {
                translateBtn.disabled = false;
                translateBtn.classList.remove('opacity-70');
                translateBtn.querySelector('span').textContent = '送信・翻訳する';
                loadingSpinner.classList.add('hidden');
            }
        }

        function saveCurrentSessionInput() {
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.inputText = inputText.value;
                if (inputText.value.trim().length > 0 && session.results.length === 0) {
                    session.title = inputText.value.trim().substring(0, 15).replace(/\n/g, ' ') + '...';
                }
                saveStateToStorage();
            }
        }

        function renderTabList() {
            tabList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId;
                const btn = document.createElement('button');
                btn.className = `text-left w-full px-3 py-2 rounded-lg text-[14px] truncate transition-colors ios-btn flex items-center justify-between ${isActive ? 'bg-gray-800 dark:bg-gray-700 text-white font-semibold' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate';
                titleSpan.textContent = (session.isProcessing ? '⏳ ' : '') + session.title;

                btn.appendChild(titleSpan);
                btn.onclick = () => switchSession(session.id);
                tabList.appendChild(btn);
            });
        }

        function updateTranslationVisibilityUI() {
            const translatedElements = document.querySelectorAll('.translated-content');
            translatedElements.forEach(el => {
                if (isTranslationVisible) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            if (isTranslationVisible) {
                toggleTranslationText.textContent = '回答(訳文)を非表示';
                toggleEyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            } else {
                toggleTranslationText.textContent = '回答(訳文)を表示';
                toggleEyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                `;
            }
        }

        toggleTranslationVisibilityBtn.addEventListener('click', () => {
            isTranslationVisible = !isTranslationVisible;
            updateTranslationVisibilityUI();
        });

        inputText.addEventListener('input', () => saveCurrentSessionInput());
        newTabBtn.addEventListener('click', createNewSession);
        
        clearCacheBtn.addEventListener('click', () => {
            if (confirm("すべてのタブと履歴を削除します。\n※APIキーの設定は保持されます。\nよろしいですか？")) {
                localStorage.removeItem('bilingual_reader_sessions');
                localStorage.removeItem('bilingual_reader_current_id');
                sessions = [];
                currentSessionId = null;
                createNewSession();
                showToast("すべての履歴をクリアしました");
            }
        });

        menuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        });
        sidebarOverlay.addEventListener('click', closeSidebarMobile);

        function closeSidebarMobile() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.attachedFiles = [];
                renderPreviews(session);
            }
            outputSection.classList.add('hidden');
            inputText.focus();
            saveCurrentSessionInput();
        });

        translateBtn.addEventListener('click', processTranslation);
        closeErrorBtn.addEventListener('click', closeError);

        togglePromptBtn.addEventListener('click', () => {
            if (promptArea.classList.contains('hidden')) {
                const session = sessions.find(s => s.id === currentSessionId);
                promptInput.value = session.prompt;
                apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
                promptArea.classList.remove('hidden');
                promptArea.classList.add('flex');
            } else {
                promptArea.classList.add('hidden');
                promptArea.classList.remove('flex');
            }
        });

        resetPromptBtn.addEventListener('click', () => {
            promptInput.value = DEFAULT_PROMPT;
        });

        applyPromptBtn.addEventListener('click', () => {
            const session = sessions.find(s => s.id === currentSessionId);
            const chosenPrompt = promptInput.value.trim() || DEFAULT_PROMPT;
            session.prompt = chosenPrompt;
            
            localStorage.setItem('bilingual_reader_latest_prompt', chosenPrompt);

            const keyVal = apiKeyInput.value.trim();
            if (keyVal) {
                localStorage.setItem('gemini_api_key', keyVal);
            }

            promptArea.classList.add('hidden');
            promptArea.classList.remove('flex');
            saveStateToStorage();
        });

        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            let imageFound = false;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const b64Data = await fileToBase64(blob);
                    session.attachedFiles.push({
                        name: `ペースト画像_${Date.now()}`,
                        mimeType: b64Data.mimeType,
                        data: b64Data.data
                    });
                    imageFound = true;
                }
            }
            if (imageFound) {
                renderPreviews(session);
                showToast("画像を添付しました");
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            for (const file of e.target.files) {
                const b64Data = await fileToBase64(file);
                session.attachedFiles.push({
                    name: file.name,
                    mimeType: b64Data.mimeType,
                    data: b64Data.data
                });
            }
            renderPreviews(session);
            fileInput.value = '';
        });

        function renderPreviews(session) {
            previewContainer.innerHTML = '';
            if (!session.attachedFiles || session.attachedFiles.length === 0) return;

            session.attachedFiles.forEach((file, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative group w-16 h-16 rounded-lg overflow-hidden border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-[#2C2C2E] flex items-center justify-center';

                if (file.mimeType.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = `data:${file.mimeType};base64,${file.data}`;
                    img.className = 'w-full h-full object-cover';
                    wrap.appendChild(img);
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'text-[10px] text-gray-500 dark:text-gray-400 font-bold p-1 text-center truncate';
                    icon.textContent = 'PDF';
                    wrap.appendChild(icon);
                }

                const delBtn = document.createElement('button');
                delBtn.className = 'absolute top-0 right-0 bg-black/60 text-white rounded-bl p-0.5 hover:bg-red-600 transition-colors ios-btn';
                delBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                delBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    session.attachedFiles.splice(index, 1);
                    renderPreviews(session);
                };

                wrap.appendChild(delBtn);
                previewContainer.appendChild(wrap);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    mimeType: file.type,
                    data: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
            });
        }

        async function copyToClipboard(text, successMsg = "コピーしました") {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg);
            } catch (err) {
                showError("クリップボードへのコピーに失敗しました。");
            }
        }

        function formatSessionResults(results) {
            let text = "";
            results.forEach(block => {
                if (block.speaker) text += `(${block.speaker})\n`;
                if (block.sourceText) text += `${block.sourceText}\n\n`;
                if (block.translatedText) text += `${block.translatedText}\n\n`;
            });
            return text.trim();
        }

        copyCurrentTabBtn.addEventListener('click', () => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session || !session.results || session.results.length === 0) {
                showError("現在のタブにコピーする結果がありません。");
                return;
            }
            const output = formatSessionResults(session.results);
            copyToClipboard(output, "タブ内の結果をコピーしました");
        });

        copyAllTabsBtn.addEventListener('click', () => {
            const validSessions = sessions.filter(s => s.results && s.results.length > 0);
            if (validSessions.length === 0) {
                showError("コピー可能な結果が存在しません。");
                return;
            }

            const orderedSessions = [...validSessions].reverse();
            const combinedText = orderedSessions.map((s) => {
                const header = `=== [${s.title}] ===`;
                const content = formatSessionResults(s.results);
                return `${header}\n\n${content}`;
            }).join('\n\n---\n\n');

            copyToClipboard(combinedText, "全タブの結果を一括コピーしました");
        });

        window.copyCardById = function(cardId) {
            const block = window[cardId];
            if (!block) return;
            let text = "";
            if (block.speaker) text += `(${block.speaker})\n`;
            if (block.sourceText) text += `${block.sourceText}\n\n`;
            if (block.translatedText) text += `${block.translatedText}`;
            copyToClipboard(text.trim(), "カードの内容をコピーしました");
        };

        async function processTranslation() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showError("APIキーが設定されていません。「プロンプト設定 / APIキー設定」からAPIキーを入力してください。");
                return;
            }

            const text = inputText.value.trim();
            const targetSession = sessions.find(s => s.id === currentSessionId);
            const attachedFiles = targetSession.attachedFiles || [];

            if (!text && attachedFiles.length === 0) {
                showError("テキストまたは画像を入力・ペーストしてください。");
                return;
            }

            targetSession.isProcessing = true;
            updateTranslateButtonState(true);
            renderTabList();

            if (currentSessionId === targetSession.id) {
                outputSection.classList.add('hidden');
                resultsContainer.innerHTML = '';
            }

            try {
                const results = await callGeminiAPI(apiKey, text, attachedFiles, targetSession.prompt);
                
                targetSession.results = results;
                if (text) {
                    targetSession.title = text.substring(0, 15).replace(/\n/g, ' ') + '...';
                } else {
                    targetSession.title = "画像解析";
                }

                if (currentSessionId === targetSession.id) {
                    renderResults(results);
                }
                
                saveStateToStorage();

            } catch (err) {
                console.error(err);
                showError(err.message || "通信中にエラーが発生しました。通信状況やAPIキーをご確認ください。");
            } finally {
                targetSession.isProcessing = false;
                if (currentSessionId === targetSession.id) {
                    updateTranslateButtonState(false);
                }
                renderTabList();
            }
        }

        async function callGeminiAPI(apiKey, text, attachedFiles, promptStr, retries = 3, delay = 1000) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const parts = [];
            if (text) parts.push({ text: text });
            attachedFiles.forEach(fileData => {
                parts.push({
                    inlineData: { mimeType: fileData.mimeType, data: fileData.data }
                });
            });

            const jsonInstruction = `\n\nYOU MUST RESPOND ONLY WITH A VALID JSON ARRAY. No explanations, no markdown blocks outside the JSON.
Format:
[
  {
    "speaker": "Speaker Name (or empty string. Use if applicable)",
    "sourceText": "Original text segment, user query, or topic description",
    "translatedText": "Translated text, answer, or your main response"
  }
]
If the user asks a general question, put the context/question in 'sourceText' and your answer in 'translatedText'.`;

            const payload = {
                contents: [{ parts: parts }],
                systemInstruction: {
                    parts: [{ text: promptStr + jsonInstruction }]
                },
                generationConfig: {
                    temperature: 0.2,
                    responseMimeType: "application/json"
                },
                // セーフティフィルターの制限を解除（ブロックしないように設定）
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400) throw new Error("APIエラー (400): リクエスト形式が無効です。");
                        if (response.status === 403) throw new Error("APIエラー (403): APIキーが無効か権限がありません。");
                        if (response.status === 404) throw new Error("APIエラー (404): モデルエンドポイントが見つかりません。");
                        throw new Error(`APIエラー: ${response.status}`);
                    }

                    const result = await response.json();
                    let rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (rawText) {
                        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                        try {
                            const parsed = JSON.parse(rawText);
                            if (Array.isArray(parsed)) {
                                return parsed;
                            } else {
                                return [parsed];
                            }
                        } catch (parseError) {
                            console.warn("JSON Parse Error, falling back to raw text rendering", parseError);
                            return [{
                                speaker: "",
                                sourceText: "",
                                translatedText: rawText
                            }];
                        }
                    } else {
                        // エラーの詳細な理由をコンソールに出力し、画面にも表示する
                        console.error("Full API Response:", result);
                        const finishReason = result.candidates?.[0]?.finishReason;
                        
                        if (finishReason === 'SAFETY') {
                            throw new Error("APIエラー: 不適切と判定されたため、Geminiのセーフティフィルターによって回答がブロックされました。");
                        } else if (finishReason === 'RECITATION') {
                            throw new Error("APIエラー: 著作権保護（既存の文章との一致）により回答がブロックされました。");
                        } else {
                            throw new Error("APIレスポンスにテキストが含まれていません。（詳細はブラウザの開発者ツールコンソールをご確認ください）");
                        }
                    }
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        function renderResults(dataArray) {
            resultsContainer.innerHTML = '';
            if (!Array.isArray(dataArray) || dataArray.length === 0) return;

            dataArray.forEach(block => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-[#1C1C1E] rounded-[14px] shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden relative group";

                let speakerHtml = '';
                if (block.speaker) {
                    speakerHtml = `
                        <div class="px-4 py-2.5 bg-gray-50 dark:bg-[#2C2C2E] border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <span class="text-[13px] font-semibold text-gray-500 dark:text-gray-400">${escapeHtml(block.speaker)}</span>
                        </div>
                    `;
                }

                const cardId = 'card_' + Math.random().toString(36).substr(2, 9);
                window[cardId] = block;

                const copyBtnHtml = `
                    <button class="absolute top-2 right-2 p-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 bg-white/80 dark:bg-black/80 rounded-md opacity-0 group-hover:opacity-100 transition-opacity ios-btn" onclick="copyCardById('${cardId}')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                `;

                const sourceHtml = block.sourceText ? `
                    <div class="text-[16px] text-gray-900 dark:text-gray-100 leading-relaxed font-sans pr-8">
                        ${escapeHtml(block.sourceText).replace(/\n/g, '<br>')}
                    </div>
                ` : '';

                const translatedHtml = `
                    <div class="translated-content ${isTranslationVisible ? '' : 'hidden'} flex flex-col gap-3">
                        ${block.sourceText ? '<div class="h-px bg-gray-100 dark:bg-gray-800 w-full"></div>' : ''}
                        <div class="text-[16px] text-[#007AFF] dark:text-[#60A5FA] leading-relaxed font-sans pr-8">
                            ${escapeHtml(block.translatedText || '').replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;

                const textHtml = `
                    <div class="p-4 flex flex-col gap-3 ${speakerHtml ? 'pt-4' : 'pt-5'}">
                        ${sourceHtml}
                        ${translatedHtml}
                    </div>
                `;

                card.innerHTML = speakerHtml + copyBtnHtml + textHtml;
                resultsContainer.appendChild(card);
            });

            outputSection.classList.remove('hidden');
            setTimeout(() => {
                outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function showToast(msg = "コピーしました") {
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorModal.classList.remove('hidden');
            errorModal.classList.add('flex');
            requestAnimationFrame(() => {
                errorModal.classList.remove('opacity-0');
                errorModalBox.classList.remove('scale-95');
            });
        }

        function closeError() {
            errorModal.classList.add('opacity-0');
            errorModalBox.classList.add('scale-95');
            setTimeout(() => {
                errorModal.classList.add('hidden');
                errorModal.classList.remove('flex');
            }, 300);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
