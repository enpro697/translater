<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bilingual Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-btn:active {
            opacity: 0.7;
            transform: scale(0.98);
        }
        .ios-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="h-screen text-black flex overflow-hidden">

    <!-- サイドバー -->
    <aside id="sidebar" class="bg-gray-900 text-white w-64 md:w-80 flex-shrink-0 flex flex-col h-full absolute md:relative z-30 transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="p-3 flex gap-1.5 border-b border-gray-800">
            <button id="copyAllTabsBtn" title="全タブのレスポンスを一括コピー" class="flex-1 bg-gray-800 hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="truncate">全タブコピー</span>
            </button>
            <button id="copyCurrentTabBtn" title="現在のタブのレスポンスをコピー" class="flex-1 bg-gray-800 hover:bg-gray-700 text-[12px] font-medium py-2 px-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span class="truncate">タブ内コピー</span>
            </button>
            <button id="newTabBtn" class="flex-none bg-blue-600 hover:bg-blue-500 text-[12px] font-medium py-2 px-2.5 rounded-lg flex items-center justify-center gap-1 transition-colors ios-btn">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>新規</span>
            </button>
        </div>
        <div id="tabList" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1"></div>
    </aside>

    <!-- モバイル用オーバーレイ -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- メインコンテンツ -->
    <div class="flex-1 flex flex-col h-full relative w-full overflow-hidden bg-[#F2F2F7]">
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 flex-none px-4 py-3 flex items-center justify-between z-10">
            <button id="menuBtn" class="md:hidden p-1 -ml-1 text-gray-600 ios-btn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="text-[17px] font-semibold tracking-tight mx-auto">Bilingual Reader</h1>
            <div class="w-6 md:hidden"></div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full">
            <div class="max-w-2xl mx-auto flex flex-col gap-6">
                <!-- 入力エリア -->
                <section class="flex flex-col gap-3">
                    <div class="flex justify-between items-end px-1">
                        <label for="inputText" class="text-[13px] text-gray-500 uppercase font-medium">X (Twitter) のテキスト / 画像ペースト</label>
                        <button id="clearBtn" class="text-[15px] text-[#007AFF] ios-btn">クリア</button>
                    </div>
                    <div class="bg-white rounded-[10px] overflow-hidden shadow-sm border border-gray-200 focus-within:ring-2 focus-within:ring-[#007AFF]/30 transition-all">
                        <textarea id="inputText" rows="5" class="w-full p-4 text-[17px] leading-relaxed outline-none resize-none" placeholder="ここにテキストをペースト、またはクリップボードの画像を直接貼り付け (Ctrl+V)..."></textarea>
                    </div>

                    <!-- 添付ファイル選択 & 画像プレビューエリア -->
                    <div class="flex flex-col gap-2 px-1">
                        <div class="flex items-center gap-2">
                            <input type="file" id="fileInput" multiple accept="image/*, application/pdf" class="text-[13px] text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[13px] file:font-semibold file:bg-[#007AFF]/10 file:text-[#007AFF] hover:file:bg-[#007AFF]/20 transition-colors cursor-pointer w-full">
                        </div>
                        
                        <!-- プレビューリスト -->
                        <div id="previewContainer" class="flex flex-wrap gap-2 empty:hidden pt-1"></div>
                    </div>

                    <div class="flex justify-end px-1 mt-1">
                        <button id="togglePromptBtn" class="text-[13px] text-gray-500 underline ios-btn flex items-center gap-1">
                            <span>⚙️ 翻訳ルール設定 / APIキー設定</span>
                        </button>
                    </div>
                    
                    <div id="promptArea" class="hidden flex-col gap-4 p-4 bg-white rounded-[10px] shadow-sm border border-gray-200">
                        <div class="flex flex-col gap-1">
                            <label for="apiKeyInput" class="text-[13px] text-gray-700 font-semibold">Gemini APIキー</label>
                            <input type="password" id="apiKeyInput" class="w-full p-2.5 text-[14px] bg-gray-50 rounded border border-gray-200 outline-none" placeholder="AIzaSy... または AQ...">
                            <span class="text-[11px] text-gray-400">※APIキーはブラウザ内（localStorage）にのみ安全に保存され、Gitリポジトリ等へ送信されることはありません。</span>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[13px] text-gray-700 font-semibold">AIへの指示文 (編集可能)</label>
                            <textarea id="promptInput" rows="7" class="w-full p-3 text-[14px] bg-gray-50 rounded border border-gray-200 outline-none resize-none leading-relaxed"></textarea>
                        </div>

                        <div class="flex justify-between items-center mt-1">
                            <button id="resetPromptBtn" class="text-[14px] text-red-500 font-medium ios-btn">プロンプトをデフォルトに戻す</button>
                            <button id="applyPromptBtn" class="text-[14px] bg-gray-800 text-white px-4 py-2 rounded-[8px] font-medium ios-btn">設定を保存して閉じる</button>
                        </div>
                    </div>
                    
                    <button id="translateBtn" class="bg-[#007AFF] text-white rounded-[14px] py-3.5 px-4 font-semibold text-[17px] mt-2 shadow-sm transition-transform ios-btn flex justify-center items-center gap-2 w-full">
                        <span>対訳を生成する</span>
                        <div id="loadingSpinner" class="ios-spinner hidden"></div>
                    </button>
                </section>

                <!-- 出力エリア -->
                <section id="outputSection" class="flex flex-col gap-4 pb-12 hidden">
                    <h2 class="text-[13px] text-gray-500 uppercase font-medium px-1 mt-4">翻訳結果</h2>
                    <div id="resultsContainer" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- カスタムエラーモーダル -->
    <div id="errorModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-xl rounded-[14px] p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="errorModalBox">
            <h3 class="text-[17px] font-semibold mb-2">エラー</h3>
            <p id="errorMessage" class="text-[13px] text-gray-600 mb-5 leading-relaxed"></p>
            <div class="border-t border-gray-200 -mx-6 -mb-6">
                <button id="closeErrorBtn" class="w-full py-3 text-[17px] text-[#007AFF] font-semibold ios-btn">OK</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-[14px] opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-lg">
        コピーしました
    </div>

    <script>
        const DEFAULT_PROMPT = `You are a bilingual translator optimized for mobile reading. Parse the user's text (X/Twitter post or dialogue, and attached images), identify speakers or paragraph breaks, and provide structured Japanese-English translations.

CRITICAL RULES for chunking:
- Divide the text into logical chunks of roughly 7 to 8 lines.
- The maximum length of a single chunk MUST NOT exceed 10 lines.
- ALWAYS split at natural sentence boundaries (e.g., Japanese full stops "。"). Do not cut mid-sentence.
- 漫画等ルビが振ってある場合は、ルビは原文に表示しなくてよい
`;

        let sessions = [];
        let currentSessionId = null;

        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const outputSection = document.getElementById('outputSection');
        const resultsContainer = document.getElementById('resultsContainer');
        
        const promptArea = document.getElementById('promptArea');
        const togglePromptBtn = document.getElementById('togglePromptBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const promptInput = document.getElementById('promptInput');
        const resetPromptBtn = document.getElementById('resetPromptBtn');
        const applyPromptBtn = document.getElementById('applyPromptBtn');

        const errorModal = document.getElementById('errorModal');
        const errorModalBox = document.getElementById('errorModalBox');
        const errorMessage = document.getElementById('errorMessage');
        const closeErrorBtn = document.getElementById('closeErrorBtn');
        const toast = document.getElementById('toast');

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.getElementById('menuBtn');
        const newTabBtn = document.getElementById('newTabBtn');
        const copyAllTabsBtn = document.getElementById('copyAllTabsBtn');
        const copyCurrentTabBtn = document.getElementById('copyCurrentTabBtn');
        const tabList = document.getElementById('tabList');

        apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';

        createNewSession();

        function createNewSession() {
            const id = Date.now().toString();
            const newSession = {
                id: id,
                title: '新規チャット',
                inputText: '',
                prompt: DEFAULT_PROMPT,
                results: [],
                attachedFiles: [], // { name, mimeType, data (base64) }
                isProcessing: false
            };
            sessions.unshift(newSession);
            switchSession(id);
        }

        function switchSession(id) {
            if (currentSessionId) saveCurrentSessionInput();
            
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            
            inputText.value = session.inputText;
            promptInput.value = session.prompt;
            fileInput.value = '';
            
            renderPreviews(session);
            updateTranslateButtonState(session.isProcessing);

            if (session.results && session.results.length > 0) {
                renderResults(session.results);
            } else {
                resultsContainer.innerHTML = '';
                outputSection.classList.add('hidden');
            }
            
            renderTabList();
            closeSidebarMobile();
        }

        function updateTranslateButtonState(isProcessing) {
            if (isProcessing) {
                translateBtn.disabled = true;
                translateBtn.classList.add('opacity-70');
                translateBtn.querySelector('span').textContent = '処理中...';
                loadingSpinner.classList.remove('hidden');
            } else {
                translateBtn.disabled = false;
                translateBtn.classList.remove('opacity-70');
                translateBtn.querySelector('span').textContent = '対訳を生成する';
                loadingSpinner.classList.add('hidden');
            }
        }

        function saveCurrentSessionInput() {
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.inputText = inputText.value;
                if (inputText.value.trim().length > 0 && session.results.length === 0) {
                    session.title = inputText.value.trim().substring(0, 15).replace(/\n/g, ' ') + '...';
                }
            }
        }

        function renderTabList() {
            tabList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId;
                const btn = document.createElement('button');
                btn.className = `text-left w-full px-3 py-2 rounded-lg text-[14px] truncate transition-colors ios-btn flex items-center justify-between ${isActive ? 'bg-gray-800 text-white font-semibold' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate';
                titleSpan.textContent = (session.isProcessing ? '⏳ ' : '') + session.title;

                btn.appendChild(titleSpan);
                btn.onclick = () => switchSession(session.id);
                tabList.appendChild(btn);
            });
        }

        // --- クリップボード画像ペースト処理 (Ctrl+V) ---
        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            let imageFound = false;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const b64Data = await fileToBase64(blob);
                    session.attachedFiles.push({
                        name: `ペースト画像_${Date.now()}`,
                        mimeType: b64Data.mimeType,
                        data: b64Data.data
                    });
                    imageFound = true;
                }
            }
            if (imageFound) {
                renderPreviews(session);
                showToast("画像を添付しました");
            }
        });

        // ファイル選択からの追加
        fileInput.addEventListener('change', async (e) => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            for (const file of e.target.files) {
                const b64Data = await fileToBase64(file);
                session.attachedFiles.push({
                    name: file.name,
                    mimeType: b64Data.mimeType,
                    data: b64Data.data
                });
            }
            renderPreviews(session);
            fileInput.value = ''; // 連続選択可能にする
        });

        // プレビュー描画 & 削除ボタン
        function renderPreviews(session) {
            previewContainer.innerHTML = '';
            if (!session.attachedFiles || session.attachedFiles.length === 0) return;

            session.attachedFiles.forEach((file, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative group w-16 h-16 rounded-lg overflow-hidden border border-gray-300 bg-gray-100 flex items-center justify-center';

                if (file.mimeType.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = `data:${file.mimeType};base64,${file.data}`;
                    img.className = 'w-full h-full object-cover';
                    wrap.appendChild(img);
                } else {
                    const icon = document.createElement('span');
                    icon.className = 'text-[10px] text-gray-500 font-bold p-1 text-center truncate';
                    icon.textContent = 'PDF';
                    wrap.appendChild(icon);
                }

                // 削除ボタン
                const delBtn = document.createElement('button');
                delBtn.className = 'absolute top-0 right-0 bg-black/60 text-white rounded-bl p-0.5 hover:bg-red-600 transition-colors ios-btn';
                delBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                delBtn.onclick = (ev) => {
                    ev.stopPropagation();
                    session.attachedFiles.splice(index, 1);
                    renderPreviews(session);
                };

                wrap.appendChild(delBtn);
                previewContainer.appendChild(wrap);
            });
        }

        inputText.addEventListener('input', () => saveCurrentSessionInput());
        newTabBtn.addEventListener('click', createNewSession);
        menuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        });
        sidebarOverlay.addEventListener('click', closeSidebarMobile);

        function closeSidebarMobile() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.attachedFiles = [];
                renderPreviews(session);
            }
            outputSection.classList.add('hidden');
            inputText.focus();
            saveCurrentSessionInput();
        });

        translateBtn.addEventListener('click', processTranslation);
        closeErrorBtn.addEventListener('click', closeError);

        togglePromptBtn.addEventListener('click', () => {
            if (promptArea.classList.contains('hidden')) {
                const session = sessions.find(s => s.id === currentSessionId);
                promptInput.value = session.prompt;
                apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
                promptArea.classList.remove('hidden');
                promptArea.classList.add('flex');
            } else {
                promptArea.classList.add('hidden');
                promptArea.classList.remove('flex');
            }
        });

        resetPromptBtn.addEventListener('click', () => {
            promptInput.value = DEFAULT_PROMPT;
        });

        applyPromptBtn.addEventListener('click', () => {
            const session = sessions.find(s => s.id === currentSessionId);
            session.prompt = promptInput.value.trim() || DEFAULT_PROMPT;
            
            const keyVal = apiKeyInput.value.trim();
            if (keyVal) {
                localStorage.setItem('gemini_api_key', keyVal);
            }

            promptArea.classList.add('hidden');
            promptArea.classList.remove('flex');
        });

        async function copyToClipboard(text, successMsg = "コピーしました") {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg);
            } catch (err) {
                showError("クリップボードへのコピーに失敗しました。");
            }
        }

        function formatSessionResults(results) {
            let text = "";
            results.forEach(block => {
                if (block.speaker) text += `(${block.speaker})\n`;
                text += `${block.japaneseText}\n\n`;
                text += `${block.englishText}\n\n`;
            });
            return text.trim();
        }

        copyCurrentTabBtn.addEventListener('click', () => {
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session || !session.results || session.results.length === 0) {
                showError("現在のタブにコピーする翻訳結果がありません。");
                return;
            }
            const output = formatSessionResults(session.results);
            copyToClipboard(output, "タブ内の対訳をコピーしました");
        });

        copyAllTabsBtn.addEventListener('click', () => {
            const validSessions = sessions.filter(s => s.results && s.results.length > 0);
            if (validSessions.length === 0) {
                showError("コピー可能な翻訳結果が存在しません。");
                return;
            }

            const orderedSessions = [...validSessions].reverse();
            const combinedText = orderedSessions.map((s) => {
                const header = `=== [${s.title}] ===`;
                const content = formatSessionResults(s.results);
                return `${header}\n\n${content}`;
            }).join('\n\n---\n\n');

            copyToClipboard(combinedText, "全タブの対訳を一括コピーしました");
        });

        function showToast(msg = "コピーしました") {
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorModal.classList.remove('hidden');
            errorModal.classList.add('flex');
            requestAnimationFrame(() => {
                errorModal.classList.remove('opacity-0');
                errorModalBox.classList.remove('scale-95');
            });
        }

        function closeError() {
            errorModal.classList.add('opacity-0');
            errorModalBox.classList.add('scale-95');
            setTimeout(() => {
                errorModal.classList.add('hidden');
                errorModal.classList.remove('flex');
            }, 300);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    mimeType: file.type,
                    data: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
            });
        }

        async function processTranslation() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showError("APIキーが設定されていません。「翻訳ルール設定 / APIキー設定」からAPIキーを入力してください。");
                return;
            }

            const text = inputText.value.trim();
            const targetSession = sessions.find(s => s.id === currentSessionId);
            const attachedFiles = targetSession.attachedFiles || [];

            if (!text && attachedFiles.length === 0) {
                showError("テキストまたは画像を入力・ペーストしてください。");
                return;
            }

            targetSession.isProcessing = true;
            updateTranslateButtonState(true);
            renderTabList();

            if (currentSessionId === targetSession.id) {
                outputSection.classList.add('hidden');
                resultsContainer.innerHTML = '';
            }

            try {
                const results = await callGeminiAPI(apiKey, text, attachedFiles, targetSession.prompt);
                
                targetSession.results = results;
                if (text) {
                    targetSession.title = text.substring(0, 15).replace(/\n/g, ' ') + '...';
                } else {
                    targetSession.title = "画像翻訳";
                }

                if (currentSessionId === targetSession.id) {
                    renderResults(results);
                }
            } catch (err) {
                console.error(err);
                showError(err.message || "翻訳中にエラーが発生しました。通信状況やAPIキーをご確認ください。");
            } finally {
                targetSession.isProcessing = false;
                if (currentSessionId === targetSession.id) {
                    updateTranslateButtonState(false);
                }
                renderTabList();
            }
        }

        async function callGeminiAPI(apiKey, text, attachedFiles, promptStr, retries = 3, delay = 1000) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const parts = [];
            if (text) parts.push({ text: text });
            attachedFiles.forEach(fileData => {
                parts.push({
                    inlineData: { mimeType: fileData.mimeType, data: fileData.data }
                });
            });

            const jsonInstruction = `\n\nYOU MUST RESPOND ONLY WITH A VALID JSON ARRAY. No explanations, no markdown blocks.
Format:
[
  {
    "speaker": "Speaker Name (or empty string)",
    "japaneseText": "Japanese segment",
    "englishText": "English translation"
  }
]`;

            const payload = {
                contents: [{ parts: parts }],
                systemInstruction: {
                    parts: [{ text: promptStr + jsonInstruction }]
                },
                generationConfig: {
                    temperature: 0.2,
                    responseMimeType: "application/json"
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400) throw new Error("APIエラー (400): リクエスト形式が無効です。");
                        if (response.status === 403) throw new Error("APIエラー (403): APIキーが無効か権限がありません。");
                        if (response.status === 404) throw new Error("APIエラー (404): モデルエンドポイントが見つかりません。");
                        throw new Error(`APIエラー: ${response.status}`);
                    }

                    const result = await response.json();
                    let rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawText) {
                        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                        return JSON.parse(rawText);
                    } else {
                        throw new Error("APIレスポンスの形式が正しくありません。");
                    }
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        function renderResults(dataArray) {
            resultsContainer.innerHTML = '';
            if (!Array.isArray(dataArray) || dataArray.length === 0) return;

            dataArray.forEach(block => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[14px] shadow-sm border border-gray-200 overflow-hidden relative group";

                let speakerHtml = '';
                if (block.speaker) {
                    speakerHtml = `
                        <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
                            <span class="text-[13px] font-semibold text-gray-500">${escapeHtml(block.speaker)}</span>
                        </div>
                    `;
                }

                const cardId = 'card_' + Math.random().toString(36).substr(2, 9);
                window[cardId] = block;

                const copyBtnHtml = `
                    <button class="absolute top-2 right-2 p-2 text-gray-400 hover:text-gray-700 bg-white/80 rounded-md opacity-0 group-hover:opacity-100 transition-opacity ios-btn" onclick="copyCardById('${cardId}')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                `;

                const textHtml = `
                    <div class="p-4 flex flex-col gap-3 pt-4">
                        <div class="text-[16px] text-gray-900 leading-relaxed font-sans pr-8">
                            ${escapeHtml(block.japaneseText).replace(/\n/g, '<br>')}
                        </div>
                        <div class="h-px bg-gray-100 w-full"></div>
                        <div class="text-[16px] text-[#007AFF] leading-relaxed font-sans pr-8">
                            ${escapeHtml(block.englishText).replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;

                card.innerHTML = speakerHtml + copyBtnHtml + textHtml;
                resultsContainer.appendChild(card);
            });

            outputSection.classList.remove('hidden');
            setTimeout(() => {
                outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        window.copyCardById = function(cardId) {
            const block = window[cardId];
            if (!block) return;
            let text = "";
            if (block.speaker) text += `(${block.speaker})\n`;
            text += `${block.japaneseText}\n\n${block.englishText}`;
            copyToClipboard(text, "カードの対訳をコピーしました");
        };

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
